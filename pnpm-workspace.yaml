packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
# Libraries such as react-native-svg import 'react' types without declaring
# @types/react, so it must be visible from the virtual store for tsc to type them.
publicHoistPattern:
  - '@types/react'
# Peers that pnpm would otherwise auto-install at their newest release; pin them to
# the versions Expo SDK 57 / React Native 0.86 expect.
overrides:
  '@react-native/metro-config': 0.86.3
  react-native-worklets: 0.10.1
