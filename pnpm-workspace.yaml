packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - babel-preset-expo@58.0.16
  - expo-asset@58.0.16
  - expo-modules-core@58.0.20
  - expo-modules-jsi@58.0.14
  - expo@58.0.12
  - expo-glass-effect@58.0.4
  - expo-router@58.0.21
  - react-native-svg@15.16.0
  - react-native@0.88.0
# Libraries such as react-native-svg import 'react' types without declaring
# @types/react, so it must be visible from the virtual store for tsc to type them.
publicHoistPattern:
  - '@types/react'
